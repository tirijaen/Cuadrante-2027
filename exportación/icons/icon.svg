<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="moonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>

  <!-- Calendar Base -->
  <g transform="translate(56, 68)">
    <!-- Calendar Header -->
    <rect x="0" y="0" width="400" height="360" rx="36" fill="#1e293b" stroke="rgba(99, 102, 241, 0.4)" stroke-width="4"/>
    <path d="M 0,36 C 0,16 16,0 36,0 L 364,0 C 384,0 400,16 400,36 L 400,90 L 0,90 Z" fill="url(#badgeGrad)"/>
    
    <!-- Calendar Rings -->
    <rect x="80" y="-18" width="28" height="42" rx="14" fill="#e2e8f0" filter="url(#glow)"/>
    <rect x="292" y="-18" width="28" height="42" rx="14" fill="#e2e8f0" filter="url(#glow)"/>

    <!-- Shift Pills Representation inside calendar -->
    <!-- Mañana (Emerald) -->
    <rect x="44" y="128" width="92" height="68" rx="20" fill="url(#emeraldGrad)" opacity="0.95"/>
    <text x="90" y="172" fill="#ffffff" font-family="system-ui, sans-serif" font-size="34" font-weight="800" text-anchor="middle">M</text>

    <!-- Tarde (Amber) -->
    <rect x="154" y="128" width="92" height="68" rx="20" fill="url(#sunGrad)" opacity="0.95"/>
    <text x="200" y="172" fill="#ffffff" font-family="system-ui, sans-serif" font-size="34" font-weight="800" text-anchor="middle">T</text>

    <!-- Noche (Violet) -->
    <rect x="264" y="128" width="92" height="68" rx="20" fill="url(#moonGrad)" opacity="0.95"/>
    <text x="310" y="172" fill="#ffffff" font-family="system-ui, sans-serif" font-size="34" font-weight="800" text-anchor="middle">N</text>

    <!-- Year 2027 Badge -->
    <rect x="70" y="230" width="260" height="76" rx="24" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
    <text x="200" y="281" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="36" font-weight="800" text-anchor="middle" letter-spacing="4">2027</text>
  </g>

  <!-- Location Tag 'ANDÚJAR' -->
  <text x="256" y="465" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="middle" letter-spacing="6">ANDÚJAR</text>
</svg>
